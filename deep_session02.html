<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>멀티미디어 연습</title>
</head>
<body>
    <!--이미지-->
    <img src="https://pimg.mk.co.kr/meet/neds/2019/11/image_readtop_2019_937818_15736086053974580.jpg" alt="dog" width="100px">
    <img src="https://health.chosun.com/site/data/img_dir/2024/12/13/2024121302504_0.jpg" alt="cat" width="5%">
    <!--오디오-->
    <audio controls>
        <source src="예시오디오.mp3" type="audio/mpeg">
        브라우저가 오디오를 지원하지 않습니다.
    </audio>
    <!--비디오-->
    <video width="192" height="108" controls>
        <source src="예시비디오.mp4" type="video/mp4">
        브라우저가 비디오를 지원하지 않습니다.
    </video>
    <!--인라인 프레임-->
    <iframe src="https://www.youtube.com/watch?v=RdYVw7gBv14" width="384" height="216" frameborder="0" allowfullscreen></iframe>
    <br>
    <!--벡터 그래픽-->
    <svg width="20" height="30">
        <circle cx="24" cy="24" r="40" stroke="white" stroke-width="2" fill="skyblue" />
    </svg>
    <!--피규어-->
    <figure>
        <img src="https://pimg.mk.co.kr/meet/neds/2019/11/image_readtop_2019_937818_15736086053974580.jpg" alt="dog" width="4%">
        <figcaption>귀여운 강아지입니다.</figcaption>
    </figure>
</body>
