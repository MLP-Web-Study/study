<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>숙제</title>
    <link href="quadrantstyle.css" rel="stylesheet">
</head>
<body>
    <div class="area">
        <div class="row">
            <div class="quater first"> <!--2사분면-->
                <div class="back blackbox">
                    <div class="box red h30"></div>
                    <div class="box orange h45"></div>
                    <div class="box yellow h60"></div>
                    <div class="box green h75"></div>
                    <div class="box blue h60"></div>
                    <div class="box darkblue h45"></div>
                    <div class="box black h30"></div>
                </div>
                <div class="back bluebox">
                    <div class="box red h30"></div>
                    <div class="box orange h45"></div>
                    <div class="box yellow h60"></div>
                    <div class="box green h75"></div>
                    <div class="box blue h60"></div>
                    <div class="box darkblue h45"></div>
                    <div class="box black h30"></div>
                </div>
            </div>
            <div class="quater second"> <!--1사분면-->
                <div class="round black s1">
                    <div class="round darkblue s2">
                        <div class="round blue s3">
                            <div class="round green s4">
                                <div class="round yellow s5">
                                    <div class="round orange s6">
                                        <div class="round red s7"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="quater third"> <!--3사분면-->
                <div class="one">
                    <div class="tall"></div> 
                    <div class="short"></div>
                </div>
                <div class="two">
                    <div class="left"></div>
                    <div class="right">
                        <div class="inside1">
                            <div class="dyellow"></div>
                            <div class="byellow"></div>
                        </div>
                        <div class="inside2"></div>
                    </div>
                </div>
                <div class="three"></div>
            </div>
            <div class="quater fourth last"> <!--4사분면-->
                <div class="round black s1 last">
                    <div class="round darkblue s2 last">
                        <div class="round blue s3 last">
                            <div class="round green s4 last">
                                <div class="round yellow s5 last">
                                    <div class="round orange s6 last">
                                        <div class="round red s7 last"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
