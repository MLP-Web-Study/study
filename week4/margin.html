<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      div {
        width: 200px;
        height: 100px;
        background: #ffbc8a;
      }
      .box1 {
        margin: 30px 50px 30px 50px;
      }
      .box2 {
        margin: 30px 50px;
      }
      .box3 {
        margin: 50px;
      }
      .box4 {
        margin: 30px 5px 10px;
      }
      .box-auto {
        margin: 0 auto; /* 너비 값을 뺀 나머지 공간의 좌우 마진을 똑같이 맞춥니다. */
      }
    </style>
  </head>
  <body>
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box3"></div>
    <div class="box4"></div>
    <div class="box-auto"></div>
  </body>
</html>
