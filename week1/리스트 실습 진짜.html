<!DOCTYPE html>
<html>
<head>
    <title>리스트트</title>
</head>
<body>
   <h1>내가 좋아하는 게임</h1>
   <ul>
    <li>배틀그라운드</li>
    <li>리그 오브 레전드</li>
    <li>오버워치</li>
  </ul>
   <h1>라면 끓이는 방법</h1>
   <ol>
    <li>물을 끓인다다</li>
    <li>면 또는 스프를 먼저 넣는다</li>
    <li>그 후 남는 재료를 넣는다</li>
    <li>3분 30초 정도 끓여준다</li>
    <li>맛있게 먹는다</li>
   </ol>
   <h1>정의</h1>
   <dl>
    <dt>배틀그라운드</dt>
    <dd>총게임</dd>
  
    <dt>리그 오브 레전드</dt>
    <dd>5ㄷ5 타워 깨는 게임</dd>
  
    <dt>오버워치</dt>
    <dd>총, 칼 여러 무기를 사용해 플레이하는 5ㄷ5게임</dd>
  </dl>
</body>
</html>
