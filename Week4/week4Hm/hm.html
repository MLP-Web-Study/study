<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./hm.css">
    <title>여러가지 만들어보기</title>
</head>
<body>
    <main>
        <div id="container">
            <div class="top">
                <div class="square quad1">
                    <div class="black">
                        <div class="item red_box"></div>
                        <div class="item orange_box"></div>
                        <div class="item yellow_box"></div>
                        <div class="item green_box"></div>
                        <div class="item blue_box"></div>
                        <div class="item purple_box"></div>
                        <div class="item black_box"></div>
                    </div>
                    <div class="sky">
                        <div class="item red_box">  </div>
                        <div class="item orange_box"></div>
                        <div class="item yellow_box"></div>
                        <div class="item green_box"></div>
                        <div class="item blue_box"></div>
                        <div class="item purple_box"></div>
                        <div class="item black_box"></div>
                    </div>
                </div>
                <div class="square quad2"></div>
            </div>

            <div class="bottom">
                <div class="square quad3">
                    <div class="line header"></div>
                    <div class="line nav"></div>
                    <div class="line mid">
                        <div class="line aside"></div>
                        <div class="line main">
                            <div class="article">
                                <div class="figure"></div>
                                <div class="p"></div>
                            </div>
                            <div class="section"></div>
                        </div>
                    </div>
                    <div class="line footer"></div>


                </div>
                <div class="square quad4"></div>
            </div>
        </div>
    </main>
</body>
</html>
