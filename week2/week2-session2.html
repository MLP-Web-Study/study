<!DOCTYPE html>
<html lang="kr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./week2-session2.css">
    <title>멀티미디어 요소 정리</title>
</head>
<body>
    <!-- 흔히 아는 이미지 태그-->
    <h2><span class="spanAudioclass">image tag</span></h2>
    <img class="imgClass" src="../week1/톰.gif" alt="대체입니다.">

    
    <hr>
    <!-- 오디오 요소 파일경로를 type에 파일형식에 맞게 저장장-->
    <h2><span class="spanAudioclass">Audio tag</span></h2>
    <h3><span class="spanAudioclass">제목: Belive in miracle</span></h3>
    <audio controls>
        <source src="./believe in miracle.mp3" type="audio/mp3">
    </audio>
    <br>


    <hr>
    <!-- 비디오 요소
    오디오 요소와 거의 동일하다 -->
    <h2><span class="spanAudioclass">Video tag</span></h2>
    <video width=500 height="300" controls>
        <source src="./톰.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <br>


    <hr>
    <!-- 인라인 프레임
    외부 웹 페이지, 동영상 플레이어 등을 현재 웹 페이지에 삽입하는데 사용됨.
    웹 페이지에 다른 문서를 내장하거나 외부 콘텐츠를 표시할 때 유용함
    sre = 경로
    frameborder = 프레임 테두리 여부 0,1
    allowfullscreen = 사용자가 프레임을 전체 화면으로 확장할 수 있도록 허용-->
    <h2><span class="spanAudioclass">Iframe tag</span></h2>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/U34kLXjdw90?si=i2tpI4vtXAtcFcjt" 
    title="YouTube video player" 
    frameborder="0" 
    allowfullscreen></iframe>
    <br>

    <hr>
    <!-- 캔버스 태그:  JavaScript를 사용하여 그래픽을 그릴 수 있는 영역을 생성하는 데 사용
    예시 JS
    var canvas = document.getElementById("myCanvas");
    var ctx = canvas.getContext("2d");
    ctx.fillStyle = "green";
    ctx.fillRect(10, 10, 100, 100);-->
    <h2><span class="spanAudioclass">Canvas, Svg tag</span></h2>
    <canvas id="myCanvas" width="300" height="150" style="border:1px solid #000;"></canvas>

    <!-- <svg> 요소는 확장 가능한 벡터 그래픽을 정의하는 데에 사용되며, XML 기반으로 작성됩니다. -->
    <svg width="100" height="100">
        <circle cx="50" cy="50" r="40" stroke="black" stroke-width="3" fill="red" />
    </svg>
    <br>

    <hr>
    <!-- figure, figcaption 태그
    figure는 독립적인 콘텐츠를 표헌함.
    figcaption은 figure의 콘텐츠에 대한 설명을 제공-->
    <h2><span class="spanAudioclass">Figure, Figcaption tag</span></h2>
    <figure>
    <img src="../week1/제리.gif" alt="무한 90도 인사">
    <figcaption>자기도취에 빠진 제리.gif</figcaption>
    </figure>
    <br>

    <hr>
    <!-- 이미지 맵 태그(map, area)
    이미지 맵은 이미지 내부의 '여러 영역'을 정의하고 각각의 영역에
    '하이퍼링크'를 제공함.
    요즘은 이미지 맵의 내부의 좌표를 생성해주는 사이트가 있어 사용하기 편함.
    Image Map Generated by http://www.image-map.net/
    <map></map> : 이미지 맵을 정의
    <area> : 이미지의 각 영역을 정의 함.
    shape : rect, poly, circle등이 있는데 영역의 형태를 지정한다.
    coords : 영역의 좌표를 지정한다.-->
    <h2><span class="spanAudioclass">Image Map tag</span></h2>
    <img src="Money.jpg" usemap="#image-map">
    <map name="image-map">
        <area target="_blank" alt="나락" title="나락" 
        href="https://www.google.com/finance/quote/TSLA:NASDAQ" 
        coords="112,101,44,43" shape="rect">

        <area target="_blank" alt="가즈아아" title="가즈아아" 
        href="https://www.google.com/finance/quote/NVDA:NASDAQ" 
        coords="11,138,89,190" shape="rect">
    </map>
</body>
</html>
