<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>user imformation</title>
</head>
<body>
    <h1>사용자 정보 입력</h1>
    <form action="/" method="post">
        <label for="uname">이름 : </label>
        <input type="text" id="uname" name="uname" required>
        <br>

        <label for="email">e-mail : </label>
        <input type="email" id="email" name="email" required>
        <br>

        <label for="password">비밀번호 : </label>
        <input type="password" id="password" name="password" required>
        <br>

        <label>마케팅 광고 수신 : </label>
        <label for="agree">
            <input type="radio" id="agree" name="agree" value="agree"> 동의
        </label>
        <label for="disagree">
            <input type="radio" id="disagree" name="disagree" value="disagree"> 비동의
        </label>
        <br>

        <label for="country">국가 : </label>
        <select id="country" name="country">
            <option value="kr">대한민국</option>
            <option value="ch">중국</option>
            <option value="jp">일본</option>
            <option value="au">호주</option>
            <option value="en">미국</option>
            <option value="ex">기타</option>
        </select>
        <br>

        <button type="submit">가입</button>
    </form>
</body>
</html>
